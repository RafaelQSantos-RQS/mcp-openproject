name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: mcp-openproject
            asset_name: mcp-openproject-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: mcp-openproject
            asset_name: mcp-openproject-macos-arm64.tar.gz
          # Temporarily disabled due to macos-13 (Intel) runner scarcity on GitHub Actions
          # - target: x86_64-apple-darwin
          #   os: macos-13
          #   artifact_name: mcp-openproject
          #   asset_name: mcp-openproject-macos-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: mcp-openproject.exe
            asset_name: mcp-openproject-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release ${{ matrix.artifact_name }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload binary asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all binary assets
        uses: actions/download-artifact@v4
        with:
          pattern: mcp-openproject-*
          merge-multiple: true
          path: dist

      - name: Generate a changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.changelog }}
          files: dist/*
