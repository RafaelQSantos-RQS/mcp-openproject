name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: mcp-openproject
            asset_name: mcp-openproject-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: mcp-openproject
            asset_name: mcp-openproject-macos-arm64.tar.gz
          # Temporarily disabled due to macos-13 (Intel) runner scarcity on GitHub Actions
          # - target: x86_64-apple-darwin
          #   os: macos-13
          #   artifact_name: mcp-openproject
          #   asset_name: mcp-openproject-macos-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: mcp-openproject.exe
            asset_name: mcp-openproject-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release ${{ matrix.artifact_name }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
