# git-cliff configuration file for Conventional Commits
# Documentation: https://git-cliff.org/docs/configuration

[changelog]
# Template for the changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
          {% if commit.breaking %}[**breaking**] {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
          {% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/RafaelQSantos-RQS/mcp-openproject/commit/{{ commit.id }})){% endif %}\
    {% endfor %}
{% endfor %}
"""
# Template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the body
trim = true

[git]
# Parse commits according to the Conventional Commits specification
conventional_commits = true
# Exclude commits that do not match the conventional commits specification
filter_unconventional = false
# Regex-based parsers to map conventional commit types to changelog groups
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/CD" },
    { message = "^build", group = "Build" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
]
# Protect breaking changes from being filtered out
protect_breaking_commits = false
# Filter out commits that are not part of any group
filter_commits = false
# Tag pattern
tag_pattern = "v[0-9].*"
# Sort commits chronologically
sort_commits = "oldest"
